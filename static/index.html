<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Triatra Fresh 5.0 – Klasemen</title>
<style>
:root{
  --canvas:#F4F7F4; --wall:#EAF0EB; --head:#4F6F5B; --bar:#7FA68A; --db:#A9C5B1;
  --line:#D5E0D8; --num:#2F4A3A; --sub:#6B7A70; --ink:#2B2B2B;
  --run:#D79B80; --walk:#7FA68A;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;color:var(--ink);background:var(--wall);transition:background .25s;min-height:100vh;padding:16px 16px 64px}
.db{max-width:1240px;margin:0 auto;background:var(--canvas);border:1px solid var(--line);border-radius:12px;padding:16px;transition:background .25s,border-color .25s}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--head);outline-offset:2px}

.hd{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.hd h1{margin:0;font-size:20px;font-weight:600;color:var(--num);letter-spacing:.2px}
.hd-r{display:flex;gap:8px;align-items:center}
.pill{font-size:12px;background:#fff;color:var(--sub);border:1px solid var(--line);padding:5px 12px;border-radius:8px}
.btn{background:var(--head);color:#fff;border:1px solid var(--head);border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer}
.btn:hover{filter:brightness(1.08)}

.nav{display:flex;gap:6px;margin-bottom:12px}
.nav button{flex:1;padding:8px 0;font-size:13px;font-weight:600;background:#fff;border:1px solid var(--line);border-radius:8px;cursor:pointer;color:var(--ink)}
.nav button[aria-selected="true"]{background:var(--head);border-color:var(--head);color:#fff}
.nav button:not([aria-selected="true"]):hover{background:var(--wall)}

.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters input,.filters select{background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;min-width:0}
.filters input{flex:1 1 200px}
.filters select{flex:0 1 220px}
.filters .reset{background:transparent;border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:13px;color:var(--sub);cursor:pointer}

.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
.cd{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.cd span{display:block;font-size:12px;color:var(--sub)}
.cd b{display:block;margin-top:2px;font-size:28px;font-weight:600;color:var(--num);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cd b.sm{font-size:20px;line-height:42px}

.body{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:10px;align-items:start}
.pn{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.pn h2{margin:0 0 8px;font-size:13px;font-weight:600;color:var(--sub)}
.scroll{max-height:560px;overflow:auto}

table{width:100%;border-collapse:collapse;font-size:13px}
thead th{position:sticky;top:0;background:var(--head);color:#fff;font-weight:600;font-size:12px;text-align:left;padding:6px 8px}
thead th:first-child{border-radius:6px 0 0 6px}thead th:last-child{border-radius:0 6px 6px 0}
th.r,td.r{text-align:right;font-variant-numeric:tabular-nums}
tbody td{padding:5px 8px;border-bottom:1px solid #ECECEC}
tbody tr.hl td{background:var(--canvas)}
td.nm{max-width:210px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td.ar{color:var(--sub);max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk{display:inline-block;width:22px;height:20px;line-height:20px;text-align:center;border-radius:5px;font-size:12px;font-weight:600;color:#3A3A3A}
.rk.n{color:var(--sub);font-weight:400}
.km{display:block;padding:1px 6px;border-radius:3px;font-weight:600}
.tag{display:inline-block;padding:1px 8px;border-radius:5px;font-size:12px;color:var(--ink);white-space:nowrap}

.bars{display:flex;flex-direction:column;gap:2px}
.bar{display:grid;grid-template-columns:150px minmax(0,1fr) 52px;gap:8px;align-items:center;padding:4px 4px;border-radius:5px;font-size:12.5px}
.bar.hl{background:var(--canvas)}
.bar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .v{text-align:right;font-variant-numeric:tabular-nums}
.bt{height:14px;border-radius:4px;background:#F1F1F1;display:flex;overflow:hidden}
.bt i{display:block;height:100%;transition:width .3s}
.lg{font-size:12px;color:var(--sub);margin-top:8px}
.lg b{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 8px;vertical-align:-1px}
.lg b:first-child{margin-left:0}

.empty{padding:36px 12px;text-align:center;color:var(--sub);font-size:14px}
.empty .btn{margin-top:12px}

.foot{position:fixed;left:16px;right:16px;bottom:10px;display:flex;justify-content:space-between;gap:8px;pointer-events:none;font-size:12px}
.foot span{pointer-events:auto;background:#fff;border:1px solid var(--line);color:var(--sub);padding:4px 10px;border-radius:8px}
.foot .size{color:var(--num);font-weight:600}

.toast{position:fixed;left:50%;top:16px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:8px;font-size:13px;z-index:10;max-width:90vw}
.toast.err{background:#9B3B2B}
.drop{position:fixed;inset:0;background:rgba(79,111,91,.88);color:#fff;display:none;align-items:center;justify-content:center;font-size:22px;font-weight:600;z-index:9}
.drop.on{display:flex}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (max-width:820px){
  .body{grid-template-columns:minmax(0,1fr)}
  .cards{grid-template-columns:minmax(0,1fr)}
  .bar{grid-template-columns:96px minmax(0,1fr) 46px}
  .hd h1{font-size:17px}
  .foot #upd{display:none}
  .foot .size{white-space:nowrap;margin-left:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="db" id="db">
  <div class="hd">
    <h1 id="ttl">TRIATRA FRESH 5.0</h1>
    <div class="hd-r">
      <span class="pill" id="cutoff">Cut-off: –</span>
      <button class="btn" id="upBtn" type="button">Upload data</button>
      <input class="sr" type="file" id="file" accept=".xlsx,.xlsm" tabindex="-1">
    </div>
  </div>

  <div class="nav" role="tablist" aria-label="Halaman klasemen">
    <button role="tab" data-p="walk" id="t-walk">WALK</button>
    <button role="tab" data-p="run" id="t-run">RUN</button>
    <button role="tab" data-p="kon" id="t-kon">KONTINGEN</button>
  </div>

  <div class="filters">
    <input type="search" id="q" placeholder="Cari nama peserta" aria-label="Cari nama peserta">
    <select id="area" aria-label="Filter area"><option value="">Semua area</option></select>
    <select id="top" aria-label="Jumlah baris">
      <option value="10">Top 10</option><option value="20">Top 20</option><option value="0">Semua</option>
    </select>
    <button class="reset" id="reset" type="button">Reset filter</button>
  </div>

  <div id="panel" role="tabpanel"></div>
</div>

<div class="foot">
  <span id="upd">Belum ada data</span>
  <span class="size" id="size">rekap_all: – baris × – kolom</span>
</div>
<div class="drop" id="drop">Lepas file .xlsx di sini untuk upload</div>

<script>
var THEME={
  walk:{canvas:"#F4F7F4",wall:"#EAF0EB",head:"#4F6F5B",bar:"#7FA68A",db:"#A9C5B1",line:"#D5E0D8",num:"#2F4A3A",sub:"#6B7A70"},
  run:{canvas:"#FAF5F1",wall:"#F5EBE5",head:"#A8614B",bar:"#D79B80",db:"#E8BBA6",line:"#EBD8CE",num:"#5A3427",sub:"#8A7268"},
  kon:{canvas:"#F3F6F9",wall:"#E8EEF4",head:"#4A6784",bar:"#8FA9C4",db:"#B6C8DA",line:"#D3DEE9",num:"#243746",sub:"#6A7A8A"}
};
var TITLE={walk:"TRIATRA FRESH 5.0 – WALK",run:"TRIATRA FRESH 5.0 – RUN",kon:"TRIATRA FRESH 5.0 – KONTINGEN"};
var MEDAL=["#E3C77A","#C5C9CC","#CFA07F"];
var TAGS=["#E1ECE4","#F3E3DA","#DCE6F0","#F1ECD6","#E8E0EE","#DDEBEA"];
var RUNC="#D79B80",WALKC="#7FA68A";

var S={rows:[],meta:null,page:"walk",q:"",area:"",top:"10",hl:null,token:sessionStorage.getItem("utk")||""};

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function f2(n){return Number(n).toLocaleString("id-ID",{minimumFractionDigits:2,maximumFractionDigits:2})}
function f0(n){return Number(n).toLocaleString("id-ID")}
function sum(a,k){return a.reduce(function(t,r){return t+r[k]},0)}
function $(id){return document.getElementById(id)}

function toast(msg,err){
  var t=document.createElement("div");t.className="toast"+(err?" err":"");t.textContent=msg;t.setAttribute("role","status");
  document.body.appendChild(t);setTimeout(function(){t.remove()},err?6000:3500);
}

function dateID(iso){
  if(!iso)return "–";
  var d=new Date(iso.length===10?iso+"T00:00:00":iso);
  return d.toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});
}

function applyTheme(p){
  var t=THEME[p],r=document.documentElement.style;
  r.setProperty("--canvas",t.canvas);r.setProperty("--wall",t.wall);r.setProperty("--head",t.head);
  r.setProperty("--bar",t.bar);r.setProperty("--db",t.db);r.setProperty("--line",t.line);
  r.setProperty("--num",t.num);r.setProperty("--sub",t.sub);
}

function filtered(){
  var q=S.q.trim().toLowerCase();
  return S.rows.filter(function(r){
    return (!S.area||r.area===S.area)&&(!q||r.nama.toLowerCase().indexOf(q)>=0);
  });
}

function rankDense(list,key){
  var out=[],rank=0,prev=null;
  list.forEach(function(r){if(r[key]!==prev){rank++;prev=r[key]}out.push(rank)});
  return out;
}

function rkCell(n){
  return n<=3?'<span class="rk" style="background:'+MEDAL[n-1]+'">'+n+'</span>':'<span class="rk n">'+n+'</span>';
}

function card(label,val,small){return '<div class="cd"><span>'+esc(label)+'</span><b'+(small?' class="sm"':'')+' title="'+esc(val)+'">'+esc(val)+'</b></div>'}

function tagColor(name){
  var h=0;for(var i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))>>>0;
  return TAGS[h%TAGS.length];
}

function render(){
  applyTheme(S.page);
  $("ttl").textContent=TITLE[S.page];
  document.querySelectorAll(".nav button").forEach(function(b){b.setAttribute("aria-selected",b.dataset.p===S.page)});
  $("top").style.display=S.page==="kon"?"none":"";

  var m=S.meta;
  if(m){
    $("cutoff").textContent="Cut-off: "+dateID(m.cutoff);
    $("size").textContent=m.table+": "+f0(m.rowCount)+" baris × "+f0(m.colCount)+" kolom";
    $("upd").textContent=m.uploadedAt?("Diperbarui "+dateID(m.uploadedAt)+(m.filename?" · "+m.filename:"")+" · "+m.db):("Belum ada data · "+m.db);
  }

  var panel=$("panel");
  if(!S.rows.length){
    panel.innerHTML='<div class="pn"><div class="empty">Belum ada data di database.<br>Upload file Excel rekap untuk menampilkan klasemen.<br><button class="btn" id="emptyUp" type="button">Upload data</button></div></div>';
    $("emptyUp").onclick=function(){$("file").click()};
    return;
  }

  var rows=filtered(),html;
  if(S.page==="walk"||S.page==="run")html=renderIndividual(rows,S.page);
  else html=renderKontingen(rows);
  panel.innerHTML=html;
  bindHover();
}

function renderIndividual(rows,p){
  var key=p==="walk"?"walk":"run",label=p==="walk"?"Walk":"Run";
  var act=rows.filter(function(r){return r[key]>0}).sort(function(a,b){return b[key]-a[key]||a.nama.localeCompare(b.nama)});
  var ranks=rankDense(act,key),n=+S.top;
  var show=n?act.slice(0,n):act, mx=act.length?act[0][key]:1;

  var cards='<div class="cards">'+
    card("Peserta "+p,f0(act.length))+
    card("Total "+p+" (km)",f2(sum(act,key)))+
    card(label+" terjauh (km)",f2(act.length?act[0][key]:0))+'</div>';

  if(!act.length)return cards+'<div class="pn"><div class="empty">Tidak ada peserta yang cocok dengan filter.</div></div>';

  var tr="",bars="";
  show.forEach(function(r,i){
    var w=(r[key]/mx*100).toFixed(1),id="r"+i;
    tr+='<tr data-id="'+id+'"><td>'+rkCell(ranks[i])+'</td><td class="nm" title="'+esc(r.nama)+'">'+esc(r.nama)+'</td><td class="ar" title="'+esc(r.area)+'">'+esc(r.area)+'</td><td class="r"><span class="km" style="background:linear-gradient(90deg,var(--db) '+w+'%,transparent '+w+'%)">'+f2(r[key])+'</span></td></tr>';
    bars+='<div class="bar" data-id="'+id+'"><span class="nm" title="'+esc(r.nama)+'">'+esc(r.nama)+'</span><div class="bt"><i style="width:'+w+'%;background:var(--bar)"></i></div><span class="v">'+f2(r[key])+'</span></div>';
  });
  var ttl=n?"Top "+n:"Semua peserta";
  return cards+'<div class="body"><div class="pn"><h2>Klasemen '+label+' · '+ttl+'</h2><div class="scroll"><table><thead><tr><th>#</th><th>Nama</th><th>Area</th><th class="r">'+label+' (km)</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>'+
    '<div class="pn"><h2>'+label+' (km) · '+ttl+'</h2><div class="scroll"><div class="bars">'+bars+'</div></div></div></div>';
}

function renderKontingen(rows){
  var k=rows.filter(function(r){return r.kontingen}).sort(function(a,b){return b.total-a.total||a.nama.localeCompare(b.nama)});
  var lead=k.length&&k[0].total>0?k[0].nama:"–";
  var cards='<div class="cards">'+
    card("Peserta berkontingen",f0(k.length))+
    card("Total run + walk (km)",f2(sum(k,"total")))+
    card("Terdepan",lead,true)+'</div>';

  if(!k.length)return cards+'<div class="pn"><div class="empty">Belum ada peserta dengan kontingen terisi.<br>Isi kolom Kontingen di sheet Rekap All, lalu upload ulang.</div></div>';

  var mx=Math.max.apply(null,k.map(function(r){return r.total}))||1,tr="",bars="";
  k.forEach(function(r,i){
    var id="k"+i,wr=(r.run/mx*100).toFixed(1),ww=(r.walk/mx*100).toFixed(1),wt=(r.total/mx*100).toFixed(1);
    tr+='<tr data-id="'+id+'"><td class="nm" title="'+esc(r.nama)+'">'+esc(r.nama)+'</td><td><span class="tag" style="background:'+tagColor(r.kontingen)+'">'+esc(r.kontingen)+'</span></td><td class="r">'+f2(r.run)+'</td><td class="r">'+f2(r.walk)+'</td><td class="r"><span class="km" style="background:linear-gradient(90deg,var(--db) '+wt+'%,transparent '+wt+'%)">'+f2(r.total)+'</span></td></tr>';
    bars+='<div class="bar" data-id="'+id+'"><span class="nm" title="'+esc(r.nama+" · "+r.kontingen)+'">'+esc(r.nama)+'</span><div class="bt"><i style="width:'+wr+'%;background:'+RUNC+'"></i><i style="width:'+ww+'%;background:'+WALKC+'"></i></div><span class="v">'+f2(r.total)+'</span></div>';
  });
  return cards+'<div class="body"><div class="pn"><h2>Klasemen individu (run + walk)</h2><div class="scroll"><table><thead><tr><th>Nama</th><th>Kontingen</th><th class="r">Run</th><th class="r">Walk</th><th class="r">Total (km)</th></tr></thead><tbody>'+tr+'</tbody></table></div></div>'+
    '<div class="pn"><h2>Run + walk per peserta (km)</h2><div class="scroll"><div class="bars">'+bars+'</div></div><div class="lg"><b style="background:'+RUNC+'"></b>Run<b style="background:'+WALKC+'"></b>Walk</div></div></div>';
}

function bindHover(){
  var els=document.querySelectorAll("[data-id]");
  els.forEach(function(el){
    el.addEventListener("mouseenter",function(){
      var id=el.dataset.id;
      document.querySelectorAll('[data-id="'+id+'"]').forEach(function(x){x.classList.add("hl")});
    });
    el.addEventListener("mouseleave",function(){
      document.querySelectorAll(".hl").forEach(function(x){x.classList.remove("hl")});
    });
  });
}

function fillAreas(){
  var sel=$("area"),cur=S.area,areas=[];
  S.rows.forEach(function(r){if(areas.indexOf(r.area)<0)areas.push(r.area)});
  areas.sort(function(a,b){return a.localeCompare(b)});
  sel.innerHTML='<option value="">Semua area</option>'+areas.map(function(a){return '<option value="'+esc(a)+'">'+esc(a)+'</option>'}).join("");
  if(areas.indexOf(cur)<0)S.area="";
  sel.value=S.area;
}

async function load(){
  try{
    var res=await fetch("/api/data");
    if(!res.ok)throw new Error("Server menjawab "+res.status);
    var d=await res.json();
    S.rows=d.rows;S.meta=d.meta;fillAreas();render();
  }catch(e){
    $("panel").innerHTML='<div class="pn"><div class="empty">Data belum bisa dimuat: '+esc(e.message)+'.<br>Periksa koneksi ke server atau database, lalu muat ulang halaman.</div></div>';
  }
}

async function upload(file){
  if(!file)return;
  if(!/\.xlsx?m?$/i.test(file.name)||/\.xls$/i.test(file.name)){toast("Hanya file .xlsx yang diterima.",true);return}
  if(S.meta&&S.meta.needsToken&&!S.token){
    S.token=prompt("Masukkan token upload")||"";
    if(!S.token)return;
    sessionStorage.setItem("utk",S.token);
  }
  var fd=new FormData();fd.append("file",file);
  var btn=$("upBtn");btn.disabled=true;btn.textContent="Mengunggah…";
  try{
    var res=await fetch("/api/upload",{method:"POST",body:fd,headers:{"X-Upload-Token":S.token}});
    var d=await res.json().catch(function(){return{}});
    if(res.status===401){sessionStorage.removeItem("utk");S.token="";}
    if(!res.ok)throw new Error(d.detail||("Upload gagal ("+res.status+")"));
    toast("Data diperbarui: "+f0(d.rows)+" baris × "+f0(d.cols)+" kolom");
    await load();
  }catch(e){toast(e.message,true)}
  finally{btn.disabled=false;btn.textContent="Upload data";$("file").value=""}
}

function go(p){
  if(!THEME[p])p="walk";
  S.page=p;if(location.hash!=="#"+p)history.replaceState(null,"","#"+p);render();
}

document.querySelectorAll(".nav button").forEach(function(b){b.addEventListener("click",function(){go(b.dataset.p)})});
$("q").addEventListener("input",function(e){S.q=e.target.value;render()});
$("area").addEventListener("change",function(e){S.area=e.target.value;render()});
$("top").addEventListener("change",function(e){S.top=e.target.value;render()});
$("reset").addEventListener("click",function(){S.q="";S.area="";S.top="10";$("q").value="";$("area").value="";$("top").value="10";render()});
$("upBtn").addEventListener("click",function(){$("file").click()});
$("file").addEventListener("change",function(e){upload(e.target.files[0])});
window.addEventListener("hashchange",function(){go(location.hash.slice(1))});

var dragDepth=0;
window.addEventListener("dragenter",function(e){e.preventDefault();dragDepth++;$("drop").classList.add("on")});
window.addEventListener("dragover",function(e){e.preventDefault()});
window.addEventListener("dragleave",function(){dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)$("drop").classList.remove("on")});
window.addEventListener("drop",function(e){e.preventDefault();dragDepth=0;$("drop").classList.remove("on");upload(e.dataTransfer.files[0])});

S.page=THEME[location.hash.slice(1)]?location.hash.slice(1):"walk";
render();load();
</script>
</body>
</html>
